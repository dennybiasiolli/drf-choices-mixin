name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.3.2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: uv sync --group dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group dev

      - run: uv run pytest

  # Release flow:
  #   1. build-release     — build sdist + wheel (automatic)
  #   2. publish-testpypi  — waits for "testpypi" environment approval, then TestPyPI
  #   3. publish-pypi      — waits for "pypi" environment approval, then PyPI
  #
  # Setup (once):
  #   - GitHub Settings → Environments → "testpypi" → Required reviewers
  #   - TestPyPI Trusted Publisher: workflow ci.yml, environment testpypi
  #   - GitHub Settings → Environments → "pypi" → Required reviewers
  #   - PyPI Trusted Publisher: workflow ci.yml, environment pypi
  build-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.3.2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    if: github.event_name == 'release'
    needs: [lint, test, build-release]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/drf-choices-mixin
    permissions:
      id-token: write  # for TestPyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/drf-choices-mixin
    permissions:
      id-token: write  # for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
